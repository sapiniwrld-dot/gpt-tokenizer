[project]
name = "gpt-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sapiniwrld-dot", email = "sapiniwrld@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gpt-tokenizer-rs",
    "regex>=2026.11.19",
    "tiktoken>=0.14.0",
]

[project.scripts]
gpt-tokenizer = "gpt_tokenizer:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.workspace]
members = [
    "rust",
]

[tool.uv.sources]
gpt-tokenizer-rs = { workspace = true }
